[project]
name = "paperlaiss"
version = "0.6.1"
description = "Grounded document classifier for Paperless-ngx: type, correspondent, custom fields and OCR rescue via Mistral — a stdlib-only replacement for paperless-ai."
readme = "README.md"
# Bewusst an die Testmatrix gebunden (T-3, Entscheidung des Maintainers 2026-09-25): unterstützt
# werden die drei neuesten stable Python-Reihen, wie in allen Projekten des Hauses. Mit einer
# neuen Python-Reihe steigt die Untergrenze mit — gewollt, nicht versehentlich. Gemessen läuft
# classify.py auch unter 3.8 (T-3), zugesagt wird das nicht.
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["paperless", "paperless-ngx", "document-classification", "mistral", "ocr", "self-hosted"]

# Der Klassifizierer (classify.py) ist bewusst stdlib-only — keine Laufzeit-Abhängigkeiten.
dependencies = []

[project.optional-dependencies]
# Nur für das FastAPI-Panel (panel/). Der Klassifizierer braucht davon nichts.
panel = [
    # Böden nach dem Schwachstellen-Tor (audit.yml, Auflösung `boden`): fastapi 0.133.0 ist die
    # erste Fassung mit starlette>=1.3.1, python-multipart 0.0.31 die erste ohne bekannte Lücke.
    "fastapi>=0.133.0",
    # Schlichtes uvicorn plus httptools und uvloop, die es von selbst nimmt. `[standard]` zog bis 0.6.0 auch
    # pyyaml, watchfiles, websockets und python-dotenv (ungenutzt); pyyaml 6.0.3 hat kein Wheel für CPython 3.15.
    "uvicorn>=0.32",
    "httptools>=0.9.0",
    "uvloop>=0.23.0; sys_platform != 'win32' and sys_platform != 'cygwin' and platform_python_implementation != 'PyPy'",
    "python-multipart>=0.0.31",
    # Export-Knopf: Zusammenfügen/Links/Lesezeichen und die Seiten des Inhaltsverzeichnisses.
    "pypdf>=6.21.4",
    "reportlab>=5.0",
]

[project.urls]
Homepage = "https://github.com/Ollornog/paperlaiss"
Issues = "https://github.com/Ollornog/paperlaiss/issues"

[tool.setuptools]
packages = []
