# SHA-gepinnte Actions veralten still — ein Commit-SHA sagt nicht, dass eine neuere
# Version existiert. Dependabot liest den Versions-Kommentar hinter dem Pin und öffnet
# einen PR mit dem SHA der neuen Version. Ohne diese Datei wäre das SHA-Pinning ein
# Sicherheitsgewinn, den man mit Wartungsblindheit bezahlt.
#
# Sicherheits-Updates für Abhängigkeiten laufen getrennt davon über den Repo-Schalter
# (Dependabot security updates) und brauchen keine Konfiguration.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Wartezeit vor Versions-Updates (PO 2026-09-28), gilt nicht für Sicherheits-Updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      # Patch und Minor zusammen in EINEN PR. Majors bleiben absichtlich draußen und kommen
      # einzeln: ein Major kann die Laufzeit wechseln (node20 → node24) oder Eingaben
      # entfernen, das gehört einzeln angesehen. Ein Patch-Bump mit gepinntem SHA und
      # grüner Suite gehört es nicht.
      klein:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # Die Abhängigkeiten selbst. Bis 2026-09-22 fehlten sie hier: Dependabot meldete zwar
  # Sicherheitslücken (das tut es repo-weit), aber es gab keine regulären Versions-PRs.
  # ⚠️ Grenze, gemessen an TinySesam: bei einem Projekt mit `>=`-Untergrenzen hebt die
  # Vorgabe-Strategie (widen) die Untergrenze NIE an — reguläre pip-PRs bleiben aus,
  # obwohl die Untergrenze verwundbar sein kann. Dagegen hilft nur ein Lauf gegen die
  # niedrigste auflösbare Version, nicht diese Datei.
    ignore:
      # Den Pin besitzt die repokit-Vorlage (tests/_kit/vorlage_actions.yml), er kommt mit `repokit sync`.
      # Ein Bump hier wiche von der Vorlage ab, und der PR würde nie grün (Kit 0.36.0).
      - dependency-name: "actions/create-github-app-token"
  - package-ecosystem: pip
    directory: /
    # Wartezeit vor Versions-Updates (PO 2026-09-28), gilt nicht für Sicherheits-Updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    groups:
      # Patch und Minor zusammen in EINEN PR. Majors bleiben absichtlich draußen und kommen
      # einzeln: ein Major kann die Laufzeit wechseln (node20 → node24) oder Eingaben
      # entfernen, das gehört einzeln angesehen. Ein Patch-Bump mit gepinntem SHA und
      # grüner Suite gehört es nicht.
      klein:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # Das Basis-Abbild ist per Digest gepinnt; ohne Dependabot bliebe es für immer stehen.
  # TÄGLICH statt monatlich (2026-11-12): die Wartezeit des docker-Ökosystems zählt ab `tag_last_pushed` des Kandidaten
  # auf Docker Hub (dependabot-core docker/update_checker.rb, apply_cooldown). `python:3.x-slim` wird alle paar Tage neu
  # gepusht; ein Monatslauf in so einem Fenster überspringt jeden Kandidaten und behält den alten Digest einen weiteren
  # Monat (2026-11-07). Täglich trifft das erste ruhige Drei-Tage-Fenster, die Wartezeit selbst bleibt. Auf der neuesten
  # Python-Linie bleiben: gibt es eine neuere Nebenversion, bietet Dependabot nur diese an, nie den Digest der alten.
  - package-ecosystem: docker
    directory: /panel
    # Wartezeit vor Versions-Updates (PO 2026-09-28), gilt nicht für Sicherheits-Updates.
    cooldown:
      default-days: 3
    schedule:
      interval: daily
    commit-message:
      prefix: "ci"
    groups:
      # Patch und Minor zusammen in EINEN PR. Majors bleiben absichtlich draußen und kommen
      # einzeln: ein Major kann die Laufzeit wechseln (node20 → node24) oder Eingaben
      # entfernen, das gehört einzeln angesehen. Ein Patch-Bump mit gepinntem SHA und
      # grüner Suite gehört es nicht.
      klein:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # Das Panel-Abbild: Eingabe panel/requirements.in, Hash-Lock panel/requirements.txt (seit
  # 2026-10-08). Bis dahin stand hier nichts — die Panel-Pins veralteten still.
  - package-ecosystem: uv
    directory: /panel
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    groups:
      klein:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # Die gehashte Werkzeugliste des Schwachstellen-Tors (.github/workflows/audit.yml). Ohne den
  # Eintrag würde der Pin des Prüfwerkzeugs still veralten.
  - package-ecosystem: pip
    directory: /.github/audit
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      klein:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # Die Wegwerf-Ziele der Generalprobe (release.yml auf jedem PR). Ihr Update nimmt die
  # Generalprobe selbst ab: Startet die Registry nicht, ist release.yml rot.
  # NICHT unter .github/ (2026-11-13): Dort darf Dependabot für docker-Dateien keinen PR anlegen („The request contains
  # invalid or unauthorized changes“, TinySesam .github/rehearsal 2026-11-12, connect-suite .github/grype 2026-11-05).
  # tests/test_repo.py hält jedes docker-Ökosystem aus .github/ heraus.
  - package-ecosystem: docker-compose
    directory: /tools/generalprobe
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      klein:
        patterns: ["*"]
        update-types: ["patch", "minor"]
