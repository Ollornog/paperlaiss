name: audit

# Das Schwachstellen-Tor (M6/B1 des Härtungs-Backlogs). Dependabot meldet zwar repo-weit, aber
# eine Meldung ist kein Tor: ein PR mit einer verwundbaren Auflösung würde grün.
#
# Geprüft werden vier Auflösungen, weil jede eine andere Zusage trägt:
#   neu    — was `pip install paperlaiss[panel]` heute zieht
#   boden  — die niedrigste erlaubte Fassung jeder direkten Abhängigkeit (`lowest-direct`):
#            die Zusage der `>=`-Grenzen in pyproject.toml. Dependabot hebt einen offenen
#            `>=`-Boden nie an; erscheint ein Advisory für den Boden, wird dieser Lauf rot.
#   abbild — der Hash-Lock des Panel-Abbilds (panel/requirements.txt): genau das, was ausgeliefert wird
#   werkzeuge — die gehashte Liste dieses Tors selbst (.github/audit/requirements.txt)
#
# Vorlage: C22 (Muster für M6/B1), dort ohne Abbild.
#
# Nächtlich zusätzlich, weil Advisories ohne Codeänderung erscheinen. Öffentliches Repo →
# `ubuntu-latest`, keine self-hosted Runner.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # GitHub-cron kennt nur UTC: 02:45 UTC = 04:45 Europe/Berlin (MESZ) bzw. 03:45 (MEZ).
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Auf main NICHT abbrechen (siehe ci.yml); auf Feature-Branches zählt nur der letzte Stand.
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Eigene Umgebung, gepinnt samt Hashes: Das Prüfwerkzeug gehört nicht in die Umgebung, die
      # es prüft, und kommt nicht in der gerade neuesten Fassung aus dem Index.
      - name: Werkzeuge
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --require-hashes --no-deps -r .github/audit/requirements.txt

      # Nur auflösen, nichts installieren: Metadaten aus den Rädern, kein Code der Pakete läuft.
      # `--python-version` = die Untergrenze aus requires-python, dort ist die Auflösung am ältesten.
      - name: Auflösen (neueste und niedrigste erlaubte Fassungen)
        run: |
          uv="$RUNNER_TEMP/audit/bin/uv"
          "$uv" pip compile pyproject.toml --all-extras --python-version 3.12 --no-header \
              -o "$RUNNER_TEMP/neu.txt"
          "$uv" pip compile pyproject.toml --all-extras --resolution lowest-direct \
              --python-version 3.12 --no-header -o "$RUNNER_TEMP/boden.txt"
          # Null Pakete wären ein grüner Lauf ohne Befund: das ist kein Beleg, sondern ein Fehler.
          for f in neu boden; do
            [ "$(grep -cE '^[A-Za-z0-9_.-]+==' "$RUNNER_TEMP/$f.txt")" -gt 0 ] \
              || { echo "::error::$f: nichts aufgelöst — der Lauf prüfte nichts"; exit 1; }
          done

      # `--strict`: Ein Paket, das pip-audit nicht nachschlagen kann, ist ein Fehler, kein Skip.
      - name: pip-audit
        run: |
          audit="$RUNNER_TEMP/audit/bin/pip-audit"
          for f in neu boden; do
            echo "::group::$f"
            "$audit" --strict --progress-spinner off --no-deps --disable-pip -r "$RUNNER_TEMP/$f.txt"
            echo "::endgroup::"
          done
          for f in panel/requirements.txt .github/audit/requirements.txt; do
            echo "::group::$f"
            "$audit" --strict --progress-spinner off --require-hashes --disable-pip -r "$f"
            echo "::endgroup::"
          done
