name: CI

# Feature-Branches laufen bewusst ohne CI — dort ist `ci-local` das Sicherheitsnetz.
# Das Gate sind Pull Requests und main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Auf main NICHT abbrechen: dort haengt am Lauf das Abbild bzw. der Required Check,
  # und ein abgebrochener main-Commit hat hinterher keines. Genau das ist passiert —
  # paperlaiss verlor am 2026-09-21 vier main-Laeufe innerhalb von 33 Sekunden,
  # DashMyBoard drei am 2026-07-10. Auf Feature-Branches bleibt der Abbruch richtig:
  # dort zaehlt nur der letzte Stand.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  klassifizieren:
    # Docs fast lane (repokit 0.52.0): text-only PR → the heavy job(s) below skip (a skipped job is a green check). The
    # decision lives only in scripts/_nur_text.sh; a broken classifier leaves the output empty and the job runs.
    # Push, schedule and manual runs are never text-only (no PR merge commit), so they behave as before.
    name: Text oder Code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nur_text: ${{ steps.k.outputs.nur_text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its base: _nur_text.sh needs the first parent, no credentials to fetch it.
          fetch-depth: 2
      - name: Klassifizieren
        id: k
        run: |
          if grund="$(scripts/_nur_text.sh)"; then echo "nur_text=ja" >> "$GITHUB_OUTPUT"; fi
          echo "$grund"

  tests:
    # Öffentliches Repo ⇒ GitHub-Runner. Self-hosted Runner sind hier tabu: ein Fork-PR
    # würde fremden Workflow-Code auf eigener Hardware ausführen.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Die letzten drei stable Minors — gefuehrt in repokit
        # (tests/_kit/python_matrix.json) und im Abbild ci-python-web.
        # 3.10 fiel am 2026-09-22 raus (EOL 31.10.2026).
        python: ["3.13", "3.14", "3.15"]

    steps:
      # `persist-credentials: false` ist EIGENE Haertung, kein belegter Standard —
      # GitHub empfiehlt es nirgends ausdruecklich. Seit checkout@v6 liegt das Token
      # in $RUNNER_TEMP statt in .git/config; es zaehlt dort, wo nach dem Checkout
      # fremder Code laeuft. Kein Job hier pusht selbst, also braucht keiner das Token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # Der Klassifizierer und die Tests sind stdlib-only — nichts zu installieren.
      # Der Vorher-Stand macht den Rückstands-Check unten ENTSCHEIDBAR. Er muss NACH
      # der Installation liegen: `pip install -e` erzeugt `*.egg-info`, und ohne diesen
      # Schritt wäre das ein Rückstand, den der Check der Suite zuschreibt.
      - name: Vorher-Stand des Baums
        run: ./scripts/_residue_check.sh snapshot > "$RUNNER_TEMP/baum-vorher.txt"

      - name: Suite (Fach + Hygiene)
        run: ./scripts/check.sh

      - name: Wiederholbarkeit — dieselbe Suite ein zweites Mal
        run: ./scripts/check.sh

      # Dieselbe Prüfung, die der pre-push-Hook fährt.
      - name: Arbeitsverzeichnis ist unverändert geblieben
        run: ./scripts/_residue_check.sh check --seit "$RUNNER_TEMP/baum-vorher.txt"

  image:
    needs: klassifizieren
    if: ${{ !cancelled() && needs.klassifizieren.outputs.nur_text != 'ja' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Panel-Image bauen und starten (nicht veröffentlichen)
        # Bauen UND starten (PO 2026-10-11): Erst die Startprobe nimmt das Basis-Abbild (Dependabot
        # `docker`) und panel/requirements.txt (`uv`) ab — ein Abbild, das baut, kann trotzdem nicht
        # starten.
        # Gebaut unter `paperlaiss-panel:ci`, weil die Schritte danach dieses Abbild benutzen; die
        # Probe startet genau dieses (mit Argument baut und löscht sie nichts).
        run: |
          docker build -t paperlaiss-panel:ci ./panel
          scripts/_abbild_probe.sh paperlaiss-panel:ci

      # Der PDF-Bau des Export-Knopfs braucht pypdf, reportlab und die Schrift — die hat nur das
      # Abbild, nicht die stdlib-only-Suite. Geprüft wird deshalb dort, wo er auch läuft.
      - name: Export-Knopf — PDF-Bau im Abbild prüfen
        run: docker run --rm -v "$PWD/tests:/tests:ro" paperlaiss-panel:ci python /tests/abbild_export.py

      # OCR-Modus „scans“ (T-19): manuelle Läufe und der KI-Knopf laufen im Panel und messen die Seiten mit pypdf.
      - name: OCR-Modus — Scan oder digital mit pypdf im Abbild prüfen
        run: >-
          docker run --rm -e CLASSIFY_PY=/src/classify.py -v "$PWD/tests:/tests:ro"
          -v "$PWD/classify.py:/src/classify.py:ro" paperlaiss-panel:ci python /tests/abbild_ocr_art.py

      # Prüfen and Nacharbeit (T-9): the real app against a stand-in for Paperless; app.py needs FastAPI.
      - name: Prüfen und Nacharbeit — Panel-Routen im Abbild prüfen
        run: >-
          docker run --rm -v "$PWD/tests:/tests:ro"
          -v "$PWD/classify.py:/src/classify.py:ro" paperlaiss-panel:ci python /tests/abbild_pruefen.py

  vorab:
    needs: klassifizieren
    if: ${{ !cancelled() && needs.klassifizieren.outputs.nur_text != 'ja' }}
    # Die Vorab-Schritte (Pre-Consume) laufen im Paperless-Abbild und brauchen dessen gs und qpdf —
    # die stdlib-Suite hat beides nicht. Geprüft wird deshalb im Abbild, in derselben Version wie in
    # den Installationen; beim Paperless-Update hier mitziehen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Leerseiten — Rendern und Entfernen im Paperless-Abbild prüfen
        run: >-
          docker run --rm --entrypoint python3
          -v "$PWD/tests:/tests:ro" -v "$PWD/deploy:/deploy:ro"
          ghcr.io/paperless-ngx/paperless-ngx:3.4.2 /tests/abbild_leerseiten.py
      # Upside-down pages (T-8): gs, qpdf and Tesseract from the Paperless image, scans built by the test.
      - name: Kopfüber — Seiten lesen und drehen im Paperless-Abbild prüfen
        run: >-
          docker run --rm --entrypoint python3
          -v "$PWD/tests:/tests:ro" -v "$PWD/deploy:/deploy:ro"
          ghcr.io/paperless-ngx/paperless-ngx:3.4.2 /tests/abbild_ausrichtung.py
      # OCR-Modus „scans“ (T-19): der Post-Consume-Lauf misst die Seiten mit pikepdf aus dem Paperless-Abbild.
      - name: OCR-Modus — Scan oder digital mit pikepdf im Paperless-Abbild prüfen
        run: >-
          docker run --rm --entrypoint python3 -e CLASSIFY_PY=/src/classify.py
          -v "$PWD/tests:/tests:ro" -v "$PWD/classify.py:/src/classify.py:ro"
          ghcr.io/paperless-ngx/paperless-ngx:3.4.2 /tests/abbild_ocr_art.py
