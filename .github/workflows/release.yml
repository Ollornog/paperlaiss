name: Release

# Ein Tag löst aus. Die Reihenfolge ist Absicht: erst prüfen, dann testen, dann bauen,
# dann veröffentlichen. Ein Release mit falscher Nummer ist schlimmer als keins —
# es ist unauffällig falsch. Veröffentlicht wird das Panel-Image; der Klassifizierer
# selbst ist eine stdlib-only Datei, die man einhängt, kein Abbild.
on:
  push:
    tags: ["v*"]
  # GENERALPROBE auf jedem PR (PO 2026-10-11: „alles automatisieren ohne dass was bricht“): Der
  # Workflow läuft durch wie beim Tag, veröffentlicht aber in eine Wegwerf-Registry auf dem Runner
  # (.github/generalprobe/docker-compose.yml). So nimmt ein Pflicht-Check auch die Actions ab, die
  # sonst nur am Tag laufen (Anmeldung, schiebender Bau), und ihre Dependabot-Updates mergen selbst.
  pull_request:
  workflow_dispatch:

# Oben nur Lesen; Schreibrechte bekommt allein der Job, der veröffentlicht (M6/B1, least
# privilege). Bis 2026-10-08 galt `contents/packages: write` für den ganzen Workflow — also auch
# für die Suite, die vor dem Veröffentlichen läuft.
permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: false` ist EIGENE Haertung, kein belegter Standard.
      # Dieser Job veroeffentlicht zwar, pusht aber nicht per git: `gh release create`
      # und `docker/login-action` nehmen ihr Token aus der Umgebung, nicht aus dem
      # Checkout. Das git-Token darf hier also weg.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # `workflow_dispatch` ist der TROCKENLAUF und seit 2026-09-24 auch einer: bis dahin gab es
      # den Knopf, aber jeder Druck darauf wäre hier gescheitert (`GITHUB_REF_NAME` ist dann ein
      # Branchname) — und wäre er es nicht, hätte der Lauf aus einem Branch heraus ein Abbild nach
      # ghcr GESCHOBEN und ein Release angelegt. Ein Notausgang, der klemmt oder ins Freie führt,
      # ist keiner. Ein Workflow mit `on: push: tags` wird von der normalen CI nie berührt
      # (Register 2026-09-23); der Trockenlauf ist die einzige Gelegenheit, ihn VOR dem Tag zu
      # prüfen. Dieselbe Änderung wie in 1pipe #36, DashMyBoard #56, FlyingCerts #22, C22 #47,
      # TinySesam #85 — und ab Kit 0.21.8 prüft `pruefe_veroeffentlichen_am_tag` es mechanisch.
      - name: Tag gegen die Paketversion prüfen
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "Tag $TAG, pyproject $PKG"
          [ "$TAG" = "$PKG" ] || { echo "Tag und Paketversion laufen auseinander"; exit 1; }
          grep -q "## \[$PKG\]" CHANGELOG.md || { echo "CHANGELOG kennt $PKG nicht"; exit 1; }

      # Ohne Tag gibt es nichts zu vergleichen — geprüft wird, was prüfbar ist: dass die
      # Paketversion im CHANGELOG steht. Der Schritt ist damit nicht bloß übersprungen.
      - name: Trockenlauf — Version und CHANGELOG
        if: github.ref_type != 'tag'
        run: |
          PKG=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "Trockenlauf ohne Tag. Paketversion: $PKG"
          grep -q "## \[$PKG\]" CHANGELOG.md || { echo "CHANGELOG kennt $PKG nicht"; exit 1; }
          echo "CHANGELOG kennt $PKG — bereit für den Tag v$PKG"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Suite fahren, bevor irgendetwas veröffentlicht wird
        # Auf einem PR fährt ci.yml dieselbe Suite am selben Commit — hier noch einmal kostete nur Zeit.
        if: github.event_name != 'pull_request'
        run: ./scripts/check.sh

  veroeffentlichen:
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      packages: write   # Panel-Abbild nach ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Registry-Namen kleinschreiben
        # github.repository_owner liefert die Schreibweise des Kontos; buildx verlangt
        # Kleinbuchstaben und bricht sonst ab — bei grünem Job und fehlendem Abbild.
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Abbild-Tag aus dem Ref: beim Release der Tag selbst (`v1.2.3`), im Trockenlauf der Branch.
      # Ein `/` im Branchnamen (`ci/…`) ist in einem Abbild-Tag ungültig — bis 2026-10-08 brach
      # der Trockenlauf auf jedem solchen Branch beim Bauen ab („invalid reference format").
      - name: Abbild-Tag aus dem Ref
        run: echo "ABBILD_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      # Ein SHA-Pin auf die Action deckt NICHT, was sie zur Laufzeit nachlaedt.

      # setup-qemu-action zieht per Vorgabe `tonistiigi/binfmt:latest` und fuehrt es

      # `--privileged` aus — in genau dem Job, der Abbilder baut und veroeffentlicht.

      # Deshalb per DIGEST gepinnt (entspricht dem Tag qemu-v10.2.3, 2026-06-08).

      # ⚠️ Dependabot fasst Action-EINGABEN nicht an: dieser Pin veraltet still und

      # muss von Hand gehoben werden.

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

        with:

          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      # Ohne `version` holt die Action die jeweils neueste buildx-Fassung — derselbe
      # ungepinnte Eingang wie oben, nur leiser. v0.37.1 ist die neueste stable
      # (2026-09-11). Auch dieser Pin altert ohne Dependabot.
      # Generalprobe: Die Wegwerf-Registry lauscht auf 127.0.0.1:5000 des Runners. BuildKit läuft in
      # einem eigenen Container und erreicht sie nur mit `network=host`.
      - name: "Generalprobe: Wegwerf-Registry starten"
        if: github.ref_type != 'tag'
        run: docker compose -f .github/generalprobe/docker-compose.yml up -d --wait registry

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          version: v0.37.1
          driver-opts: ${{ github.ref_type != 'tag' && 'network=host' || '' }}
          # Kein Binär-Cache: Ein Release-Workflow, der Werkzeuge aus dem Actions-Cache lädt,
          # kann eine vergiftete Fassung erben (zizmor `cache-poisoning`).
          cache-binary: false

      # Anmelden: beim Tag an ghcr, sonst an der Wegwerf-Registry — mit DERSELBEN Action.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Generalprobe: an der Wegwerf-Registry anmelden"
        if: github.ref_type != 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: localhost:5000
          username: generalprobe
          password: generalprobe

      - name: Panel-Abbild bauen und veröffentlichen (genau ein Tag, kein latest)
        id: build
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./panel
          platforms: linux/amd64,linux/arm64
          # Bauen immer (das ist der Teil, der bisher nur beim Tag lief), schieben nur beim Tag.
          push: ${{ github.ref_type == 'tag' }}
          tags: ghcr.io/${{ env.OWNER_LC }}/paperlaiss:${{ env.ABBILD_TAG }}
      - name: "Generalprobe: bauen und in die Wegwerf-Registry schieben"
        id: probe
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./panel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: localhost:5000/paperlaiss:generalprobe

      # Angekommen ist erst, was die Registry unter dem Digest kennt — mit beiden Plattformen.
      - name: "Generalprobe: Abbild in der Wegwerf-Registry nachlesen"
        if: github.ref_type != 'tag'
        env:
          DIGEST: ${{ steps.probe.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "kein Digest vom Bau"; exit 1; }
          docker buildx imagetools inspect "localhost:5000/paperlaiss@${DIGEST}" | tee "$RUNNER_TEMP/abbild.txt"
          for plattform in linux/amd64 linux/arm64; do
            grep -q "Platform: *${plattform}\$" "$RUNNER_TEMP/abbild.txt" || { echo "$plattform fehlt"; exit 1; }
          done

      - name: Digest ins Log — wer es ernst meint, pinnt ihn
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/${OWNER_LC}/paperlaiss@${DIGEST}"

      # ⚠️ NUR beim Tag. Bis 2026-09-24 hing das allein an `--verify-tag`, einem Nebeneffekt.
      - name: Release anlegen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Panel-Abbild: \`ghcr.io/${OWNER_LC}/paperlaiss:${GITHUB_REF_NAME}\`

          Digest: \`${DIGEST}\`

          Änderungen: siehe [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
