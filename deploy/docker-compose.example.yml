# Beispiel: paperlaiss an einen bestehenden Paperless-ngx-Stack hängen.
#
# 1) Den paperless-Service um das geteilte ./scripts-Volume (classify.py +
#    classify-config.json + log/traces/running) und die CLASSIFY_*-Env erweitern.
# 2) Den panel-Service ergänzen (baut ./panel).
# 3) Secrets in .env (siehe .env.example). ./scripts muss für beide Container
#    schreibbar sein. Das Panel läuft als uid/gid 1000, der Paperless-Worker als
#    USERMAP_UID/USERMAP_GID (Vorgabe ebenfalls 1000): `sudo chown -R 1000:1000 scripts`.
#    Weicht USERMAP_UID ab, beim panel `user: "<uid>:<gid>"` auf denselben Wert setzen.
#    Update von einer Fassung, in der das Panel als root lief: CHANGELOG, Upgrade-Hinweis.
services:
  paperless:
    # ... euer bestehender paperless-ngx-Service (image, db, redis, …) ...
    volumes:
      - ./scripts:/scripts
      # Optional: KI-Knopf und Korrespondenten-Abschnitt in Paperless (kein Fork, siehe README).
      # Beide Dateien müssen root gehören und dürfen für andere nicht schreibbar sein.
      - ./paperless-knoepfe/10-paperlaiss-knoepfe.sh:/custom-cont-init.d/10-paperlaiss-knoepfe.sh:ro
      - ./paperless-knoepfe/paperlaiss-knoepfe.js:/paperlaiss-knoepfe/paperlaiss-knoepfe.js:ro
    environment:
      PAPERLESS_POST_CONSUME_SCRIPT: /scripts/classify.py
      # Optional: Vorab-Schritte vor dem Import (leere Seiten, Mails als Dokument). vorab.py,
      # leerseiten.py und mailbilder.py aus deploy/vorab/ neben classify.py nach ./scripts legen.
      PAPERLESS_PRE_CONSUME_SCRIPT: /scripts/vorab.py
      # Knöpfe: wo der Browser das Panel erreicht (hinter demselben Proxy genügt ein Pfad).
      PAPERLAISS_URL: /paperlaiss
      CLASSIFY_CONFIG: /scripts/classify-config.json
      CLASSIFY_LOG: /scripts/classify.log
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}
      MISTRAL_KEY: ${MISTRAL_KEY}

  panel:
    build: ./panel
    # Oder das fertige Abbild eines Releases (Tag = Release, kein latest; Digest aus den Notizen):
    # image: ghcr.io/ollornog/paperlaiss:<tag>@sha256:<digest>
    container_name: paperlaiss-panel
    restart: unless-stopped
    ports:
      - "8400:8400"                    # in Prod hinter Reverse-Proxy + Auth (PANEL_TOKEN / TinyAuth / OIDC)
    volumes:
      - ./scripts:/scripts
      # Nur mit PANEL_AUTH=tinysesam: Benutzerdatenbank. Ein benanntes Volume übernimmt beim ersten
      # Einhängen die Rechte aus dem Abbild (uid 1000); ein Bind-Mount muss vorher uid 1000 gehören.
      # - panel-auth:/auth
    environment:
      PAPERLESS_API: http://paperless:8000/api
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}
      MISTRAL_KEY: ${MISTRAL_KEY}
      CLASSIFY_DIR: /scripts
      PANEL_TOKEN: ${PANEL_TOKEN:-}
      INGEST_TOKENS: ${INGEST_TOKENS:-{}}
      # Nur wenn Paperless und Panel auf verschiedenen Adressen/Ports laufen (CORS für die Knöpfe):
      # PAPERLAISS_KNOPF_ORIGIN: https://paperless.example.com
      # Export-Knopf (alles optional, hier die Vorgaben): Links im Inhaltsverzeichnis nach Paperless,
      # Grenzen je Export, Aufbewahrung des Ergebnisses. Uhrzeit wie Paperless (PAPERLESS_TIME_ZONE).
      # PAPERLESS_PUBLIC_URL: https://paperless.example.com
      # EXPORT_MAX_DOKUMENTE: "1000"
      # EXPORT_MAX_MB: "2000"
      # EXPORT_AUFBEWAHRUNG_MIN: "1440"
      # EXPORT_SPEICHER_MB: "10000"
    depends_on:
      - paperless

